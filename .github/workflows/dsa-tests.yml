name: DSA-II algorithm checks

on:
  push:
    branches: [main, unit4-unit5-and-final-ui]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application and DSA modules
        run: python -m compileall -q app.py warehouse_app unit1_trees unit2_graphs unit3_dynamic_programming unit4_backtracking unit5_advanced
      - name: Run Unit 4 and Unit 5 tests
        run: python -m unittest discover -s tests -v
